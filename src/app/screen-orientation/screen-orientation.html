<section id="screen-orientation-demo">
  <h2>@capacitor-geckoview/screen-orientation 屏幕方向</h2>
  <button type="button" (click)="current()">当前方向</button>
  <button type="button" (click)="lockPortrait()">锁定竖屏</button>
  <button type="button" (click)="lockLandscape()">锁定横屏</button>
  <button type="button" (click)="unlock()">解锁</button>
  <p>结果: <code>{{ result() }}</code></p>
</section>
