<section class="demo-card">
  <div class="flex items-center justify-between gap-2">
    <h2 class="demo-title">启动画面</h2>
    <span class="demo-badge">splash-screen</span>
  </div>
  <div class="demo-actions">
    <button type="button" class="demo-btn-primary" (click)="show()">显示（3 秒后隐藏）</button>
    <button type="button" class="demo-btn" (click)="hide()">立即隐藏</button>
  </div>
  <p class="demo-result">结果: {{ result() }}</p>
</section>
