<section class="demo-card">
  <div class="flex items-center justify-between gap-2">
    <h2 class="demo-title">网络状态</h2>
    <span class="demo-badge">network</span>
  </div>
  <div class="demo-actions">
    <button type="button" class="demo-btn-primary" (click)="getStatus()">获取状态</button>
    <button type="button" class="demo-btn" (click)="listen()">监听变化</button>
    <button type="button" class="demo-btn" (click)="stop()">停止监听</button>
  </div>
  <p class="demo-result">结果: {{ result() }}</p>
</section>
