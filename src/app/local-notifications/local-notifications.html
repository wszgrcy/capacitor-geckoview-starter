<section class="demo-card">
  <div class="flex items-center justify-between gap-2">
    <h2 class="demo-title">本地通知</h2>
    <span class="demo-badge">local-notifications</span>
  </div>
  <p class="demo-desc">
    注意：该插件本地目录原先缺少 <code class="demo-code">dist</code>，已先在插件仓库执行
    <code class="demo-code">npm run build</code> 生成。
  </p>
  <div class="demo-actions">
    <button type="button" class="demo-btn-primary" (click)="requestPermission()">请求权限</button>
    <button type="button" class="demo-btn" (click)="schedule()">5 秒后安排通知</button>
    <button type="button" class="demo-btn" (click)="getPending()">查看待发通知</button>
  </div>
  <p class="demo-result">结果: {{ result() }}</p>
</section>
