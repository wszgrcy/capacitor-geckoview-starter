<section class="demo-card">
  <div class="flex items-center justify-between gap-2">
    <h2 class="demo-title">读写剪贴板</h2>
    <span class="demo-badge">clipboard</span>
  </div>
  <div class="flex flex-col gap-1.5">
    <label class="demo-label" for="clipboard-text">文本</label>
    <input
      id="clipboard-text"
      type="text"
      class="demo-input"
      [value]="text()"
      (input)="text.set($any($event.target).value)"
    />
  </div>
  <div class="demo-actions">
    <button type="button" class="demo-btn-primary" (click)="write()">写入</button>
    <button type="button" class="demo-btn" (click)="read()">读取</button>
  </div>
  <p class="demo-result">结果: {{ result() }}</p>
</section>
