<section class="demo-card">
  <div class="flex items-center justify-between gap-2">
    <h2 class="demo-title">Preferences 读写</h2>
    <span class="demo-badge">@capacitor/preferences</span>
  </div>
  <div class="flex flex-col gap-3">
    <div class="flex flex-col gap-1.5">
      <label class="demo-label" for="prefs-key">key</label>
      <input
        id="prefs-key"
        type="text"
        placeholder="key"
        class="demo-input"
        [value]="key()"
        (input)="key.set($any($event.target).value)"
      />
    </div>
    <div class="flex flex-col gap-1.5">
      <label class="demo-label" for="prefs-value">value</label>
      <input
        id="prefs-value"
        type="text"
        placeholder="value"
        class="demo-input"
        [value]="value()"
        (input)="value.set($any($event.target).value)"
      />
    </div>
  </div>
  <div class="demo-actions">
    <button type="button" class="demo-btn-primary" (click)="setPrefs()">写入</button>
    <button type="button" class="demo-btn" (click)="getPrefs()">读取</button>
  </div>
  <p class="demo-result">读取结果: {{ result() }}</p>
</section>
