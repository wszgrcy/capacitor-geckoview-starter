<section class="demo-card">
  <div class="flex items-center justify-between gap-2">
    <h2 class="demo-title">打开系统浏览器</h2>
    <span class="demo-badge">browser</span>
  </div>
  <div class="flex flex-col gap-1.5">
    <label class="demo-label" for="browser-url">URL</label>
    <input
      id="browser-url"
      type="text"
      class="demo-input"
      [value]="url()"
      (input)="url.set($any($event.target).value)"
    />
  </div>
  <div class="demo-actions">
    <button type="button" class="demo-btn-primary" (click)="open()">打开</button>
    <button type="button" class="demo-btn" (click)="close()">关闭</button>
  </div>
  <p class="demo-result">结果: {{ result() }}</p>
</section>
