<section class="demo-card">

    <h2 class="demo-title">系统分享</h2>
    <span class="demo-badge">share</span>
  </div>
  <div class="demo-actions">
    <button type="button" class="demo-btn" (click)="canShare()">是否支持分享</button>
    <button type="button" class="demo-btn-primary" (click)="share()">分享</button>
  </div>
  <p class="demo-result">结果: {{ result() }}</p>
</section>
