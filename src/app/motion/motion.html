<section class="demo-card">
  <div class="flex items-center justify-between gap-2">
    <h2 class="demo-title">传感器</h2>
    <span class="demo-badge">motion</span>
  </div>
  <div class="demo-actions">
    <button type="button" class="demo-btn-primary" (click)="startAccel()">监听加速度</button>
    <button type="button" class="demo-btn" (click)="startOrientation()">监听方向</button>
    <button type="button" class="demo-btn" (click)="stop()">停止</button>
  </div>
  <div class="flex flex-col gap-2">
    <p class="demo-result">加速度: {{ accel() }}</p>
    <p class="demo-result">方向: {{ orientation() }}</p>
  </div>
</section>
