<section class="demo-card">
  <div class="flex items-center justify-between gap-2">
    <h2 class="demo-title">设备信息</h2>
    <span class="demo-badge">device</span>
  </div>
  <div class="demo-actions">
    <button type="button" class="demo-btn-primary" (click)="getInfo()">获取设备信息</button>
    <button type="button" class="demo-btn" (click)="getBattery()">获取电量</button>
    <button type="button" class="demo-btn" (click)="getId()">获取设备 ID</button>
  </div>
  <p class="demo-result">结果: {{ result() }}</p>
</section>
