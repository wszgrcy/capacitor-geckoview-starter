<section class="demo-card">
  <div class="flex items-center justify-between gap-2">
    <h2 class="demo-title">屏幕阅读器</h2>
    <span class="demo-badge">screen-reader</span>
  </div>
  <div class="demo-actions">
    <button type="button" class="demo-btn-primary" (click)="isEnabled()">是否启用</button>
    <button type="button" class="demo-btn" (click)="listen()">监听状态变化</button>
    <button type="button" class="demo-btn" (click)="stop()">停止监听</button>
  </div>
  <div class="flex flex-col gap-1.5">
    <label class="demo-label" for="screen-reader-text">朗读文本</label>
    <input
      id="screen-reader-text"
      type="text"
      class="demo-input"
      [value]="text()"
      (input)="text.set($any($event.target).value)"
    />
  </div>
  <div class="demo-actions">
    <button type="button" class="demo-btn-primary" (click)="speak()">朗读</button>
  </div>
  <p class="demo-result">结果: {{ result() }}</p>
</section>
