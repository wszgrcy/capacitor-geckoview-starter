<section class="demo-card">
  <div class="flex items-center justify-between gap-2">
    <h2 class="demo-title">调用相机</h2>
    <span class="demo-badge">@capacitor/camera</span>
  </div>
  <p class="demo-desc">通过 <code class="demo-code">Camera.takePhoto()</code> 打开原生相机并返回图片。</p>
  <div class="demo-actions">
    <button type="button" class="demo-btn-primary" (click)="takePhoto()">拍照</button>
  </div>
  @if (imageSrc()) {
    <img
      id="camera-image"
      [src]="imageSrc()"
      alt="相机拍摄结果"
      class="w-full rounded-lg border border-zinc-200 object-cover dark:border-zinc-800"
    />
  }
  <p class="demo-result">相机结果: {{ result() }}</p>
</section>
