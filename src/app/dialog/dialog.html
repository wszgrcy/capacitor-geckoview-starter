<section class="demo-card">
  <div class="flex items-center justify-between gap-2">
    <h2 class="demo-title">原生对话框</h2>
    <span class="demo-badge">dialog</span>
  </div>
  <div class="demo-actions">
    <button type="button" class="demo-btn-primary" (click)="alert()">Alert</button>
    <button type="button" class="demo-btn" (click)="confirm()">Confirm</button>
    <button type="button" class="demo-btn" (click)="prompt()">Prompt</button>
  </div>
  <p class="demo-result">结果: {{ result() }}</p>
</section>
