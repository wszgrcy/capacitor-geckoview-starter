<section id="push-notifications-demo">
  <h2>@capacitor-geckoview/push-notifications 推送通知</h2>
  <button type="button" (click)="register()">请求权限并注册</button>
  <button type="button" (click)="listen()">监听 token/通知</button>

</section>
